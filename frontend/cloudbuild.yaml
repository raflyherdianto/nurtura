steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg
      - VITE_API_BASE_URL=${_VITE_API_BASE_URL}
      - -t
      - ${_IMAGE}
      - .

images:
  - ${_IMAGE}

substitutions:
  _IMAGE: asia-southeast2-docker.pkg.dev/gen-lang-client-0272762713/nurtura/frontend:latest
  _VITE_API_BASE_URL: https://nurtura.web.id/api/v1
